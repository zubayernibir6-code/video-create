<template>
  <style>
    @font-face { font-family: "Baloo Da 2"; font-style: normal; font-weight: 400 800; src: url("assets/fonts/bengali/BalooDa2-Variable.ttf") format("truetype"); font-display: block; }
    @font-face { font-family: "Hind Siliguri"; font-style: normal; font-weight: 700; src: url("assets/fonts/bengali/HindSiliguri-Bold.ttf") format("truetype"); font-display: block; }
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F3E3C3; }
    #root .bg, #root .cam { position: absolute; inset: 0; }
    #root .actor svg, #root .prop svg { display: block; width: 100%; height: auto; overflow: visible; }
  </style>

  <div id="root" data-composition-id="s5-guest" data-width="1080" data-height="1920" data-duration="30">
    <div id="s5-bg" class="clip bg" data-start="0" data-duration="30" data-track-index="0">
      <div class="cam"></div>
    </div>
  </div>

  <script>
    (function () {
      var ID = "s5-guest", root = document.querySelector('[data-composition-id="' + ID + '"]');
      var P = HKPlan.scene("s5"), A = HKAct, q = HKCast.q, DUR = 30, B = P.beat;
      var cam = root.querySelector(".cam");
      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;

      HKSet.officeScene(cam, tl, DUR, { mode: "day", h: 9, m: 0 });
      // the app hides inside the box (drawn before the box, so the box front covers it)
      var AP = A.stand(cam, "app", 740, 860, 300, { expr: "happy" }), ap = AP.svg, apEl = AP.el;
      var box = HKSet.put(cam, HKProp.box(), { x: 560, y: 872, w: 360 });
      var lid = box.querySelector(".box-lid"), boxBody = box.querySelector(".box-body");
      var K = A.stand(cam, "khata", 300, 1180, 330, { expr: "sleep" }), k = K.svg, kEl = K.el;

      // ── morning: the ledger wakes up and stands ───────────────────────────────────────────────
      tl.set(kEl, { rotation: -82 }, 0);
      A.idle(k, tl, 0, DUR, 0.012);
      A.expr(k, tl, 0.6, "tired");
      tl.to(kEl, { rotation: 0, duration: 0.6, ease: "back.out(1.6)" }, 0.8);
      A.expr(k, tl, 1.5, "neutral");

      // ── the box rattles … the lid pops … out rises হিসাব খাতা ────────────────────────────────
      gsap.set(apEl, { y: 300, opacity: 0 });
      tl.set(apEl, { opacity: 1 }, B("rise"));
      tl.fromTo(box, { rotation: -3 }, { rotation: 3, duration: 0.13, ease: "sine.inOut", repeat: Math.round((B("shakeEnd") - B("shake")) / 0.13) - 1, yoyo: true, immediateRender: false, transformOrigin: "50% 100%" }, B("shake"));
      tl.to(box, { rotation: 0, duration: 0.1 }, B("shakeEnd"));
      tl.fromTo(lid, { y: 0 }, { y: -14, duration: 0.13, ease: "sine.inOut", repeat: 17, yoyo: true, immediateRender: false }, B("shake"));
      A.look(k, tl, B("shake") + 0.1, 12, 0, 0.3);
      A.expr(k, tl, B("shake") + 0.2, "shocked");
      var qm = HKSet.put(cam, HKProp.mark("?", "#E4A11B"), { x: 330, y: 470, w: 90, z: 9 });
      gsap.set(qm, { opacity: 0 });
      A.pop(qm, tl, B("shake") + 0.5, 0.35);
      tl.to(qm, { opacity: 0, duration: 0.2 }, B("lid") - 0.2);
      tl.to(lid, { x: 260, y: -560, rotation: 160, duration: 0.9, ease: "power2.out" }, B("lid"));
      tl.to(lid, { y: 1400, duration: 1.0, ease: "power2.in" }, B("lid") + 0.9);
      tl.to(lid, { opacity: 0, duration: 0.2 }, B("lid") + 1.7);
      tl.to(apEl, { y: -40, duration: 0.8, ease: "back.out(1.6)" }, B("rise"));
      tl.set(apEl, { zIndex: 5 }, B("rise") + 0.5);   // out of the box: now in front of it
      tl.to(apEl, { y: -80, duration: 1.4, ease: "sine.inOut", repeat: 9, yoyo: true }, B("rise") + 0.8);
      gsap.set(ap.querySelector(".c-glow"), { svgOrigin: "190 240" });
      tl.fromTo(ap.querySelector(".c-glow"), { scale: 0.4, opacity: 0 }, { scale: 1.15, opacity: 1, duration: 0.6, ease: "power2.out", immediateRender: false }, B("sparkle"));
      tl.to(ap.querySelector(".c-glow"), { scale: 1, duration: 1.2, ease: "sine.inOut", repeat: 9, yoyo: true }, B("sparkle") + 0.6);
      q(ap, ".c-spark").forEach(function (st, i) {
        tl.fromTo(st, { scale: 0, rotation: 0 }, { scale: 1.2, rotation: 90, duration: 0.5, ease: "back.out(2)", immediateRender: false }, B("sparkle") + i * 0.12);
        tl.to(st, { scale: 0.7, rotation: 180, duration: 0.9, ease: "sine.inOut", repeat: 12, yoyo: true }, B("sparkle") + 0.6 + i * 0.12);
      });
      A.expr(k, tl, B("rise") + 0.3, "shocked");
      tl.to(kEl, { y: -60, duration: 0.2, ease: "power2.out", repeat: 1, yoyo: true }, B("rise") + 0.2);

      // "হ্যালো! আমি হিসাব খাতা। আজ থেকে আমি তোমাদের সাথে কাজ করব!"
      A.wave(ap, tl, B("wave"), "r", 5);
      A.say(ap, tl, P.line("s5-01"), "s5-01", { arm: "l" });
      A.look(ap, tl, P.line("s5-01") + 0.2, -10, 2, 0.3);
      A.look(k, tl, B("rise") + 0.4, 14, -6, 0.3);

      // "আরেকটা খাতা? তাহলে কি আমার চাকরি গেল?" — narrow eyes, arms folded tight
      A.expr(k, tl, B("peek"), "suspicious");
      A.arms(k, tl, B("peek"), -40, 40, 0.35);
      tl.to(kEl, { x: -40, rotation: -6, duration: 0.5, ease: "power2.out" }, B("peek"));
      A.say(k, tl, P.line("s5-02"), "s5-02", { arm: "none" });
      A.expr(k, tl, P.line("s5-02") + 2.4, "sad");
      tl.to(kEl, { x: 0, rotation: 0, duration: 0.5, ease: "power2.inOut" }, P.line("s5-02") + 3.0);
      A.rest(k, tl, P.line("s5-02") + 3.0);
      A.expr(ap, tl, P.line("s5-02") + 1.0, "sad");

      // "না না! আমি তোমাকে সাহায্য করতে এসেছি। দেখো!" — the app floats over, offers a hand
      A.expr(ap, tl, B("reassure"), "happy");
      tl.to(AP.el, { x: -80, y: 290, duration: 1.2, ease: "power2.inOut" }, B("reassure") + 0.2);
      tl.to(AP.el, { y: 270, duration: 1.1, ease: "sine.inOut", repeat: 4, yoyo: true }, B("reassure") + 1.4);
      A.say(ap, tl, P.line("s5-03"), "s5-03", { arm: "r" });
      // the handshake
      var hd = B("hand");
      tl.to(AP.el, { y: 290, duration: 0.3 }, hd - 0.4);
      tl.to(ap.querySelector(".c-arm-l"), { rotation: 30, duration: 0.35, ease: "back.out(1.6)" }, hd - 0.3);
      tl.to(k.querySelector(".c-arm-r"), { rotation: -50, duration: 0.35, ease: "back.out(1.6)" }, hd - 0.3);
      tl.to([ap.querySelector(".c-arm-l"), k.querySelector(".c-arm-r")], { y: 14, duration: 0.14, ease: "sine.inOut", repeat: 5, yoyo: true }, hd + 0.1);
      A.expr(k, tl, B("smile"), "happy");
      tl.to(q(k, ".c-blush"), { opacity: 1, duration: 0.3 }, B("smile"));
      tl.to(kEl, { y: -50, duration: 0.25, ease: "power2.out", repeat: 3, yoyo: true }, B("smile") + 0.3);
      A.rest(k, tl, 29.2); A.rest(ap, tl, 29.2);

      A.blinks(k, tl, 2, DUR, 11); A.blinks(ap, tl, 6, DUR, 12);
      tl.to({}, { duration: DUR }, 0);
    })();
  </script>
</template>
