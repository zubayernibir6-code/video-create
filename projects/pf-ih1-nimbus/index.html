<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>IH1 · Integrations Hub — Nimbus (concept)</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <link rel="stylesheet" href="assets/css/studio.css" />
  <style>
    :root {
      /* Nimbus: deep indigo night, white ink, ONE accent — cyan — for everything that connects. */
      --bg: #0c0a24;
      --bg-2: #14113d;
      --ink: #ffffff;
      --ink-2: rgba(255, 255, 255, 0.72);
      --accent: #38e1ff;
      --cyan: #38e1ff;
      --font-display: "Geist", "Hind Siliguri", sans-serif;
      --font-body: "Geist", "Hind Siliguri", sans-serif;
      --font-mono: "Geist Mono", "Hind Siliguri", monospace;
    }
    #root { background: var(--bg); }

    /* background: indigo night with a soft radial light at the hub and a faint dot field */
    .sky { position: absolute; inset: 0; background: radial-gradient(60% 55% at 50% 52%, #241b6b 0%, #15114a 38%, #0c0a24 75%); }
    .dots2 { position: absolute; inset: 0; background-image: radial-gradient(rgba(170, 160, 255, 0.16) 1.3px, transparent 1.5px); background-size: 30px 30px; -webkit-mask-image: radial-gradient(48% 48% at 50% 52%, #000 25%, transparent 100%); mask-image: radial-gradient(48% 48% at 50% 52%, #000 25%, transparent 100%); }

    .title { position: absolute; left: 0; right: 0; top: 92px; margin: 0; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 66px; line-height: 1.05; letter-spacing: -0.035em; color: var(--ink); }
    .title em { font-style: normal; color: var(--cyan); }

    /* the network */
    .core-glow { position: absolute; left: 260px; top: 280px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(closest-side, rgba(56, 225, 255, 0.55), rgba(56, 225, 255, 0.12) 45%, rgba(56, 225, 255, 0) 100%); filter: blur(18px); }
    .netsvg { position: absolute; left: 0; top: 0; width: 1080px; height: 1080px; overflow: visible; }
    .app { position: absolute; left: 0; top: 0; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 24px; display: grid; place-items: center; color: #f1f3ff; font-size: 42px; border: 1px solid rgba(255, 255, 255, 0.16); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.22) inset, 0 18px 40px -14px rgba(0, 0, 0, 0.7); }
    .app .icon { stroke-width: 1.9; }
    .t-blue { background: linear-gradient(160deg, #4258c9, #2b3593); }
    .t-rose { background: linear-gradient(160deg, #a2457a, #6b2d58); }
    .t-teal { background: linear-gradient(160deg, #2b8f7e, #1c5f58); }
    .t-violet { background: linear-gradient(160deg, #6a4fd0, #45329a); }
    .t-amber { background: linear-gradient(160deg, #b0812c, #74531f); }
    .t-slate { background: linear-gradient(160deg, #5b6585, #3b4260); }
    .t-sky { background: linear-gradient(160deg, #3b86c9, #275b8f); }
    .t-coral { background: linear-gradient(160deg, #b8624a, #7c3f31); }
    .hub { position: absolute; left: 448px; top: 468px; width: 184px; height: 184px; border-radius: 50%; display: grid; place-items: center; color: var(--cyan); background: radial-gradient(circle at 50% 38%, #2a2470 0%, #17134a 58%, #100d34 100%); border: 1.5px solid rgba(56, 225, 255, 0.5); box-shadow: 0 0 70px rgba(56, 225, 255, 0.35), inset 0 0 34px rgba(56, 225, 255, 0.16); }
    .nmark { width: 96px; height: 96px; overflow: visible; }

    /* end card */
    .scrim { position: absolute; left: 90px; top: 150px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(closest-side, rgba(12, 10, 36, 0.92) 0%, rgba(12, 10, 36, 0.78) 55%, rgba(12, 10, 36, 0) 100%); }
    .end-col { position: absolute; left: 0; right: 0; top: 410px; display: flex; flex-direction: column; align-items: center; }
    .count { font-family: var(--font-display); font-weight: 700; font-size: 170px; line-height: 1; letter-spacing: -0.045em; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .count .plus { color: var(--cyan); }
    .lab { margin-top: 10px; font-family: var(--font-display); font-weight: 500; font-size: 50px; letter-spacing: -0.02em; color: var(--cyan); }
    .wm { position: absolute; left: 0; right: 0; top: 780px; display: flex; align-items: center; justify-content: center; gap: 20px; font-family: var(--font-display); font-weight: 600; font-size: 64px; letter-spacing: -0.035em; color: var(--ink); }
    .wm .nmark { width: 66px; height: 66px; color: var(--cyan); }
    .concept { position: absolute; right: 40px; bottom: 30px; font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255, 255, 255, 0.66); }

        <div id="app5" class="app t-slate"><svg class="icon" viewBox="0 0 24 24"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /><path d="M14 2v5a1 1 0 0 0 1 1h5" /><path d="M10 9H8" /><path d="M16 13H8" /><path d="M16 17H8" /></svg></div>
        <div id="app6" class="app t-sky"><svg class="icon" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" /></svg></div>
        <div id="app7" class="app t-coral"><svg class="icon" viewBox="0 0 24 24"><path d="M15 6a9 9 0 0 0-9 9V3" /><circle cx="18" cy="6" r="3" /><circle cx="6" cy="18" r="3" /></svg></div>
        <div id="hub" class="hub"><svg id="hub-mark" class="nmark" viewBox="0 0 120 120" data-design-ignore><use href="#nmark" /></svg></div>

    <audio id="sfx-16-impact-bass-2" src="assets/sfx/impact-bass-2.mp3" data-start="9.957" data-duration="2" data-track-index="20" data-volume="0.35" data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":1.92,"v":1},{"t":2,"v":0}]}]}'></audio>

  <script>
    document.fonts.ready.then(() => {
      const S = Studio.init({ id: "main" });
      const tl = S.tl, g = gsap;
      const CX = 540, CY = 560, HUB_R = 98;
      const KICK = (k) => 6.0 + 0.4975 * k; // studio-pulse kicks after the drop (measured: 8.09 s + 0.4975 s · k, music from 2.09)

      // ---- 0–2 · the hub ignites: glow, the hub disc, its ring draws on the first kick (0.47), orbits trace in
      tl.fromTo("#core-glow", { opacity: 0, scale: 0.4 }, { opacity: 0.7, scale: 1, duration: 1.1, ease: "settle" }, 0.12);
      tl.fromTo("#hub", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.9, ease: "springSoft" }, 0.18);
      tl.fromTo("#hub-mark", { opacity: 0, scale: 0.7, rotation: -40, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: 0, duration: 1.0, ease: "settle" }, 0.32);
      S.draw("#hub-ring", 0.47, { dur: 0.95, ease: "settle" });
      tl.fromTo("#hub-dash", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "enter" }, 0.9);
      S.draw("#ring-in", 0.95, { dur: 1.1, ease: "settle" });
      S.draw("#ring-out", 1.2, { dur: 1.2, ease: "settle" });
      S.words("#title", 0.25, { y: 30, blur: 10, dur: 0.6, ease: "settle", stagger: S.f(3) });
      const dash = S.$("#hub-dash");
      dash.style.transformBox = "view-box"; dash.style.transformOrigin = "540px 560px";
      S.everyFrame((now) => { dash.style.rotate = (now * 9).toFixed(2) + "deg"; });

      // ---- 2–6 · eight apps fly in pairs to two counter-rotating orbits (angle = base + ω·t, icons stay upright)
      const deg = Math.PI / 180;
      const apps = [
        { id: "#app0", R: 200, a0: -90, w: 0.11, at: 1.85 }, { id: "#app1", R: 200, a0: 90, w: 0.11, at: 1.85 },
        { id: "#app2", R: 330, a0: -45, w: -0.075, at: 2.37 }, { id: "#app3", R: 330, a0: 135, w: -0.075, at: 2.37 },
        { id: "#app4", R: 200, a0: 0, w: 0.11, at: 2.85 }, { id: "#app5", R: 200, a0: 180, w: 0.11, at: 2.85 },
        { id: "#app6", R: 330, a0: 45, w: -0.075, at: 3.35 }, { id: "#app7", R: 330, a0: 225, w: -0.075, at: 3.35 },
      ].map((a) => Object.assign(a, { el: S.$(a.id) }));
      const eSettle = g.parseEase("settle"), eMove = g.parseEase("move"), eGlide = g.parseEase("glide");
      const posOf = (a, now) => {
        const u = S.clamp((now - a.at) / 0.8, 0, 1), r = a.R + (880 - a.R) * (1 - eSettle(u));
        const th = a.a0 * deg + a.w * now;
        return [CX + r * Math.cos(th), CY + r * Math.sin(th), u];
      };
      S.everyFrame((now) => {
        for (const a of apps) {
          const [x, y, u] = posOf(a, now);
          a.el.style.opacity = S.clamp((now - a.at) / 0.18, 0, 1).toFixed(3);
          a.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${(0.7 + 0.3 * eSettle(u)).toFixed(3)})`;
        }
      });

      // beams: each app → hub edge, drawn out from the app (per frame, because the apps keep moving)
      const NS = "http://www.w3.org/2000/svg", beams = S.$("#beams");
      const order = [0, 1, 2, 3, 4, 5, 6, 7];
      apps.forEach((a, i) => { a.line = document.createElementNS(NS, "line"); a.bt = 3.97 + order[i] * 0.11; beams.appendChild(a.line); });
      const edge = (x, y) => { const dx = x - CX, dy = y - CY, d = Math.hypot(dx, dy) || 1; return [CX + (dx / d) * HUB_R, CY + (dy / d) * HUB_R, d]; };
      S.everyFrame((now) => {
        for (const a of apps) {
          const [x, y] = posOf(a, now), [ex, ey] = edge(x, y);
          const p = eSettle(S.clamp((now - a.bt) / 0.5, 0, 1));
          const k = 46 / Math.hypot(ex - x, ey - y); // start at the icon's edge, not its centre
          const x1 = x + (ex - x) * k, y1 = y + (ey - y) * k;
          a.line.setAttribute("x1", x1.toFixed(1)); a.line.setAttribute("y1", y1.toFixed(1));
          a.line.setAttribute("x2", (x1 + (ex - x1) * p).toFixed(1)); a.line.setAttribute("y2", (y1 + (ey - y1) * p).toFixed(1));
          a.line.setAttribute("opacity", p > 0 ? "1" : "0");
        }
      });
      // the riser before the drop: the core light gathers
      tl.to("#core-glow", { opacity: 1, scale: 1.18, duration: 0.75, ease: "glide" }, 5.25);
      tl.to("#core-glow", { opacity: 0.78, scale: 1, duration: 0.8, ease: "settle" }, 6.0);

      // ---- 6–12 · packets ride the beams and land on every kick; the hub pulses on each arrival
      const pk = S.$("#pkts"), runs = [], arrivals = [];
      for (let k = 0; k < 11; k++) {
        const t0 = KICK(k), t1 = KICK(k + 1);
        runs.push({ a: apps[(2 * k) % 8], t0, t1, dir: 1 }, { a: apps[(2 * k + 5) % 8], t0, t1, dir: 1 });
        if (k % 2 === 1) runs.push({ a: apps[(2 * k + 3) % 8], t0, t1, dir: -1 }); // and data flowing back out
        arrivals.push(t1);
      }
      runs.forEach((r) => {
        r.tail = document.createElementNS(NS, "circle"); r.head = document.createElementNS(NS, "circle");
        r.tail.setAttribute("fill", "rgba(56,225,255,0.35)"); r.head.setAttribute("fill", r.dir > 0 ? "#bff5ff" : "#38e1ff");
        pk.appendChild(r.tail); pk.appendChild(r.head);
      });
      S.everyFrame((now) => {
        for (const r of runs) {
          const u = (now - r.t0) / (r.t1 - r.t0);
          if (u < 0 || u > 1) { r.head.setAttribute("opacity", "0"); r.tail.setAttribute("opacity", "0"); continue; }
          const [x, y] = posOf(r.a, now), [ex, ey] = edge(x, y);
          const k = 46 / Math.hypot(ex - x, ey - y), x1 = x + (ex - x) * k, y1 = y + (ey - y) * k;
          const f = (v) => (r.dir > 0 ? eGlide(v) : 1 - eGlide(v));
          const ph = f(S.clamp(u, 0, 1)), pt = f(S.clamp(u - 0.035, 0, 1)); // tail hugs the head: one comet, not two dots
          r.head.setAttribute("cx", (x1 + (ex - x1) * ph).toFixed(1)); r.head.setAttribute("cy", (y1 + (ey - y1) * ph).toFixed(1));
          r.tail.setAttribute("cx", (x1 + (ex - x1) * pt).toFixed(1)); r.tail.setAttribute("cy", (y1 + (ey - y1) * pt).toFixed(1));
          const fade = Math.min(1, u * 8, (1 - u) * 10);
          r.head.setAttribute("r", r.dir > 0 ? "8.5" : "6.5"); r.tail.setAttribute("r", r.dir > 0 ? "13" : "10");
          r.head.setAttribute("opacity", fade.toFixed(2)); r.tail.setAttribute("opacity", (fade * 0.8).toFixed(2));
        }
        // hub pulse + burst ring on each arrival (seek-safe: only the latest arrival within its window counts)
        let bump = 0, ring = -1;
        for (const A of arrivals) { const d = now - A; if (d >= 0 && d < 0.55) { bump = Math.max(bump, Math.exp(-d / 0.11)); ring = d / 0.55; } }
        S.$("#hub").style.scale = (1 + 0.075 * bump).toFixed(4);
        const hb = S.$("#hub-burst");
        if (ring >= 0) { hb.setAttribute("r", (100 + 80 * eSettle(ring)).toFixed(1)); hb.setAttribute("opacity", (0.7 * (1 - ring)).toFixed(3)); }
        else hb.setAttribute("opacity", "0");
      });

      // ---- 9–12 · the network steps back; the count rises out of the hub; the name lands on the kick (≈ 9.98)
