    .tnum { font-variant-numeric: tabular-nums; }

    /* title */
    .scrim { position: absolute; border-radius: 50%; pointer-events: none; }
    #t-scrim { left: 360px; top: 250px; width: 1200px; height: 580px; background: radial-gradient(closest-side, rgba(5, 11, 20, 0.86), rgba(5, 11, 20, 0)); }
    .title { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; align-items: center; justify-content: center; }

    .title h1 .row { display: block; }
    /* the masked line reveal clips to the line box: extend the masks below so descenders (p) are never cut */
    #title .st-line-mask { padding-bottom: 0.16em; margin-bottom: -0.16em; }

    /* HUD */
    .hud { position: absolute; top: 54px; height: 34px; display: flex; align-items: center; gap: 14px; font-family: var(--font-mono); font-size: 24px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }

    .chip-h { position: absolute; left: 0; top: 0; padding: 10px 16px 12px; border-radius: 12px; background: rgba(5, 11, 20, 0.8); border: 1px solid rgba(232, 240, 255, 0.12); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7); white-space: nowrap; opacity: 0; }

    .chip-h .co { display: block; font-family: var(--font-mono); font-size: 24px; line-height: 1.25; color: var(--ink-3); margin-top: 2px; }

    .panel { position: absolute; left: 120px; top: 716px; padding: 28px 38px 30px; background: linear-gradient(180deg, rgba(20, 36, 62, 0.62), rgba(8, 16, 30, 0.58)); border-color: rgba(232, 240, 255, 0.14); }

    .wordmark { font-size: 132px; font-weight: 700; letter-spacing: -0.045em; line-height: 1.25; color: var(--ink); }  /* 1.25: char masks must hold the g descender */

  <script>
    document.fonts.ready.then(() => {
      const S = Studio.init({ id: "main" });
      const tl = S.tl, g = gsap;
      // The house spring as a FUNCTION: the HyperFrames runtime re-registers the bare ease name "spring" as linear (m => m)
      // after this page loads, so ease: "spring" renders linear. Passing the function bypasses the name lookup.
      const SPRING = Studio.springFn(0.537, 13.04, 0.8);
      const $ = (s) => document.querySelector(s);
      const ease = (n) => g.parseEase(n);
      const E = { settle: ease("settle"), move: ease("move"), enter: ease("enter"), spring: SPRING };

      // ---------------------------------------------------------------- projection: Natural Earth I, centred on 10°E
      const LON0 = 10, D2R = Math.PI / 180, SC = 325.4, CX = 960, CY = 598.2;
      const proj = (lon, lat) => {
        const l = (lon - LON0) * D2R, p = lat * D2R, p2 = p * p, p4 = p2 * p2;
        const X = l * (0.8707 - 0.131979 * p2 + p4 * (-0.013791 + p4 * (0.003971 * p2 - 0.001529 * p4)));
        const Y = p * (1.007226 + p2 * (0.015085 + p4 * (-0.044475 + 0.028874 * p2 - 0.005916 * p4)));
        return [CX + SC * X, CY - SC * Y];
      };
      const EQ = CY;   // the equator's screen y at the world view

      // ---------------------------------------------------------------- land: even-odd point-in-polygon on a 10 px hex lattice
      const polys = window.LAND.map((ring) => {
        const pts = ring.map(([lo, la]) => proj(lo, la));
        let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        for (const [x, y] of pts) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
        return { pts, x0, y0, x1, y1 };
      });
      const inside = (x, y) => {
        let c = false;
        for (const P of polys) {
          if (x < P.x0 || x > P.x1 || y < P.y0 || y > P.y1) continue;
          const q = P.pts;
          for (let i = 0, j = q.length - 1; i < q.length; j = i++) {
            const yi = q[i][1], yj = q[j][1];
            if ((yi > y) !== (yj > y) && x < ((q[j][0] - q[i][0]) * (y - yi)) / (yj - yi) + q[i][0]) c = !c;
          }
        }
        return c;
      };
      const PITCH = 10, RH = PITCH * Math.sqrt(3) / 2;
      const yTop = proj(LON0, 80)[1], yBot = proj(LON0, -56)[1];
      const land = [];
      for (let row = 0, y = yTop; y <= yBot; y += RH, row++) {
        for (let x = 46 + (row % 2 ? PITCH / 2 : 0); x <= 1874; x += PITCH) {
          if (!inside(x, y)) continue;
          const coast = !inside(x + PITCH, y) || !inside(x - PITCH, y) || !inside(x + PITCH / 2, y + RH) || !inside(x - PITCH / 2, y + RH) || !inside(x + PITCH / 2, y - RH) || !inside(x - PITCH / 2, y - RH);
          land.push({ x, y, coast, t: 0.12 + (x / 1920) * 1.45 + S.rnd() * 0.18 });   // the wave runs from the left
        }
      }

        { id: "la", name: "Los Angeles", lat: 33.74, lon: -118.27, co: "33.74°N 118.27°W", t: 6.305, anchor: "tl" },
      ];
      const H = {};
      HUBS.forEach((h, i) => { const [x, y] = proj(h.lon, h.lat); Object.assign(h, { x, y, i, a: { v: 0 } }); H[h.id] = h; });

        [40.67,-74.05],[32.08,-81.1],[32.78,-79.92],[36.95,-76.33],[29.73,-95.27],[29.95,-90.06],[25.77,-80.17],[30.4,-81.6],[39.27,-76.58],[42.35,-71.03],[44.65,-63.57],[49.29,-123.1],[47.6,-122.35],[37.8,-122.3],[32.7,-117.17],[61.22,-149.9],[54.3,-130.33],[19.05,-104.32],[17.95,-102.2],[19.2,-96.13],[22.48,-97.86],[8.95,-79.57],[9.36,-79.9],[10.4,-75.53],[11.0,-74.8],[17.97,-76.8],[15.85,-87.94],[-12.05,-77.15],[-2.28,-79.9],[3.88,-77.07],[-33.6,-71.62],[-23.65,-70.4],[-20.2,-70.15],[-34.6,-58.37],[-34.9,-56.2],[-32.05,-52.1],[-26.9,-48.66],[-25.5,-48.5],[-22.9,-43.2],[-20.32,-40.33],[-12.97,-38.5],[-8.4,-34.95],[-3.72,-38.48],[-1.45,-48.5],[10.65,-61.5],[23.13,-82.35],[18.47,-69.88],[47.56,-52.7],[21.3,-89.65]
      ];
      const coast = land.filter((d) => d.coast);
      const used = new Set();
      const near = (x, y, r) => HUBS.some((h) => Math.hypot(h.x - x, h.y - y) < r);
      let snapped = [];
      for (const [la, lo] of CAND) {
        const [px, py] = proj(lo, la);
        let best = null, bd = PITCH * 2.6;
        for (const d of coast) { const dd = Math.hypot(d.x - px, d.y - py); if (dd < bd && !used.has(d) && !near(d.x, d.y, 9)) { bd = dd; best = d; } }
        if (best) { used.add(best); snapped.push(best); }
      }
      if (snapped.length > 114) { const k = snapped.length / 114; snapped = Array.from({ length: 114 }, (_, i) => snapped[Math.floor(i * k)]); }
      window.__portCount = HUBS.length + snapped.length;          // must read 120
      const ports = snapped.map((d) => {
        let hub = HUBS[0], hd = 1e9;
        for (const h of HUBS) { const dd = Math.hypot(h.x - d.x, h.y - d.y); if (dd < hd) { hd = dd; hub = h; } }
        return { x: d.x, y: d.y, hub, hd };
      });
      const W = 0.95;
      for (const h of HUBS) {
        const mine = ports.filter((p) => p.hub === h), mx = Math.max(1, ...mine.map((p) => p.hd));
        mine.forEach((p) => (p.t = h.t + 0.12 + (p.hd / mx) * W));
      }

      // ---------------------------------------------------------------- routes: quadratic arcs lifted poleward (explicit side for N–S ones)
      const ARCS = [
        { a: "sh", b: "sg", t0: 2.75, t1: 3.305, lift: 0.26, side: 1, lane: true, ships: 3 },
        { a: "sg", b: "dx", t0: 3.5, t1: 4.055, lift: 0.22, lane: true, ships: 3 },
        { a: "dx", b: "rt", t0: 4.25, t1: 4.805, lift: 0.22, lane: true, ships: 3 },
        { a: "rt", b: "sa", t0: 5.0, t1: 5.555, lift: 0.22, ships: 2 },
        { a: "rt", b: "la", t0: 5.75, t1: 6.305, lift: 0.22, ships: 2 },
        { a: "sa", b: "sg", t0: 6.5, t1: 7.6, lift: 0.42, ships: 2 },
      ];
      const arcGeom = (A, B, lift, side) => {
        const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy);
        let nx = -dy / L, ny = dx / L;
        if (side) { if (Math.sign(nx) !== side) { nx = -nx; ny = -ny; } }
        else if ((my < EQ && ny > 0) || (my >= EQ && ny < 0)) { nx = -nx; ny = -ny; }     // poleward
        const C = { x: mx + nx * lift * L, y: my + ny * lift * L };
        const lut = [0]; let px = A.x, py = A.y;                                           // arc-length table for steady ships
        for (let k = 1; k <= 64; k++) { const u = k / 64, q = bez(A, C, B, u); lut.push(lut[k - 1] + Math.hypot(q.x - px, q.y - py)); px = q.x; py = q.y; }
        return { A, B, C, lut, len: lut[64] };
      };
      function bez(A, C, B, u) { const v = 1 - u; return { x: v * v * A.x + 2 * u * v * C.x + u * u * B.x, y: v * v * A.y + 2 * u * v * C.y + u * u * B.y }; }
      const atLen = (G, s) => { const target = s * G.len; let k = 1; while (k < 64 && G.lut[k] < target) k++; const s0 = G.lut[k - 1], s1 = G.lut[k]; return (k - 1 + (s1 > s0 ? (target - s0) / (s1 - s0) : 0)) / 64; };
      ARCS.forEach((r) => Object.assign(r, arcGeom(H[r.a], H[r.b], r.lift, r.side)));
      // thin feeder routes from a few big ports to their hub
      const FEED = [];
      [[35.1,129.0],[22.3,114.2],[13.1,80.3],[18.95,72.95],[21.48,39.18],[31.26,32.3],[53.55,9.95],[39.45,-0.32],[6.45,3.4],[-29.87,31.03],[-34.6,-58.37],[40.67,-74.05],[29.73,-95.27],[8.95,-79.57],[-33.85,151.2],[49.29,-123.1]].forEach(([la, lo]) => {
        const [px, py] = proj(lo, la);
        let best = null, bd = 1e9;
        for (const p of ports) { const dd = Math.hypot(p.x - px, p.y - py); if (dd < bd) { bd = dd; best = p; } }
        if (best && bd < PITCH * 3) FEED.push(Object.assign({ t0: best.t, t1: best.t + 0.6 }, arcGeom(best, best.hub, 0.18)));
      });

      // ---------------------------------------------------------------- camera: a pure zoom about one anchor (push 9.0 → lands 10.3,
      // pull back 12.055 → lands 13.45), plus the opening settle 0.94 → 1. The resting world view is the identity.
      const F0 = { x: 960, y: 540 };
      const laneHubs = ["rt", "dx", "sg", "sh"].map((k) => H[k]);
      const F1 = { x: (Math.min(...laneHubs.map((h) => h.x)) + Math.max(...laneHubs.map((h) => h.x))) / 2, y: (Math.min(...laneHubs.map((h) => h.y)) + Math.max(...laneHubs.map((h) => h.y))) / 2 };
      const Z1 = 2.0, ANC = { x: (Z1 * F1.x - F0.x) / (Z1 - 1), y: (Z1 * F1.y - F0.y) / (Z1 - 1) };
      const cam = { e: 0, zi: 0.94 };
      tl.fromTo(cam, { zi: 0.94 }, { zi: 1, duration: 2.4, ease: "settle" }, 0);
      tl.fromTo(cam, { e: 0 }, { e: 1, duration: 1.3, ease: "settle", immediateRender: false }, 9.0);   // on the music's drop
      tl.to(cam, { e: 0, duration: 1.4, ease: "settle" }, 12.055);
      const view = () => { const zz = Math.pow(Z1, cam.e); return { z: zz * cam.zi, fx: ANC.x + (F0.x - ANC.x) / zz, fy: ANC.y + (F0.y - ANC.y) / zz }; };
      const fx = { lane: 0, dim: 1 };
      tl.fromTo(fx, { lane: 0 }, { lane: 1, duration: 0.8, ease: "enter", immediateRender: false }, 9.05);
      tl.to(fx, { lane: 0, duration: 0.6, ease: "exit" }, 11.95);
      tl.fromTo(fx, { dim: 1 }, { dim: 0.42, duration: 0.9, ease: "move", immediateRender: false }, 12.15);

      // ---------------------------------------------------------------- hub chips: HTML, placed per frame beside their hub
      // (registered BEFORE the map draw: everyFrame runs in order, and the map draws each chip's leader from h.lead)
      const OFF = { bl: [26, -26], br: [-26, -26], tl: [26, 26], tr: [-26, 26], l: [30, -24] };
      for (const h of HUBS) {
        const el = document.createElement("div"); el.className = "chip-h"; el.id = "chip-" + h.id;
        el.innerHTML = `<span class="nm">${h.name}</span><span class="co">${h.co}</span>`;
        $("#chips").appendChild(el); h.el = el; h.w = el.offsetWidth; h.h = el.offsetHeight;
        tl.fromTo(h.a, { v: 0 }, { v: 1, duration: 0.45, ease: "enter" }, h.t + 0.08);
      }
      ["la", "sa"].forEach((k) => tl.to(H[k].a, { v: 0, duration: 0.3, ease: "exit" }, 8.85));       // they leave the regional frame
      ["sh", "sg", "dx", "rt"].forEach((k) => tl.to(H[k].a, { v: 0, duration: 0.3, ease: "exit" }, 11.95));
      S.everyFrame(() => {
        const V = view();
        for (const h of HUBS) {
          const x = (h.x - V.fx) * V.z + 960, y = (h.y - V.fy) * V.z + 540, [ox, oy] = OFF[h.anchor], slide = (1 - h.a.v) * 10;
          const ax = x + ox, ay = y + oy;
          let left = ax, top = ay;
          if (h.anchor === "bl") { top = ay - h.h; left += slide; }
          if (h.anchor === "br") { left = ax - h.w; top = ay - h.h; left -= slide; }
          if (h.anchor === "tl") { left += slide; }
          if (h.anchor === "tr") { left = ax - h.w; left -= slide; }
          if (h.anchor === "l") { top = ay - h.h / 2; left += slide; }
          h.lead = [ax, ay];
          h.el.style.left = left.toFixed(1) + "px"; h.el.style.top = top.toFixed(1) + "px"; h.el.style.opacity = h.a.v.toFixed(3);
        }
      });

      // ---------------------------------------------------------------- the per-frame map
      const cv = $("#map"), ctx = cv.getContext("2d");
      const ORANGE = "255,138,61";
      const ring = (x, y, r, a, w) => { if (a <= 0.004) return; ctx.strokeStyle = `rgba(${ORANGE},${a.toFixed(3)})`; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); };
      const glowDot = (x, y, r, a) => { const gr = ctx.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(255,190,140,${(0.55 * a).toFixed(3)})`); gr.addColorStop(0.4, `rgba(${ORANGE},${(0.28 * a).toFixed(3)})`); gr.addColorStop(1, `rgba(${ORANGE},0)`); ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };
      S.everyFrame((t) => {
        const V = view(), z = V.z, zd = Math.pow(z, 0.6), zh = Math.pow(z, 0.5);
        const SX = (x) => (x - V.fx) * z + 960, SY = (y) => (y - V.fy) * z + 540;
        const dim = fx.dim;
        ctx.clearRect(0, 0, 1920, 1080);
        // land dots: settled ones in one path, the wavefront brighter and popping
        const r0 = 2.7 * zd;
        ctx.fillStyle = `rgba(27,42,64,${dim.toFixed(3)})`;
        ctx.beginPath();
        const fresh = [];
        for (const d of land) {
          const age = t - d.t;
          if (age < 0) continue;
          const x = SX(d.x), y = SY(d.y);
          if (x < -10 || x > 1930 || y < -10 || y > 1090) continue;
          if (age < 0.5) { fresh.push([x, y, age]); continue; }
          ctx.moveTo(x + r0, y); ctx.arc(x, y, r0, 0, Math.PI * 2);
        }
        ctx.fill();
        for (const [x, y, age] of fresh) {
          const u = age / 0.5, k = 1 - u;
          const r = r0 * (age < 0.22 ? 1.35 * E.spring(age / 0.22) : 1 + 0.35 * k);
          ctx.fillStyle = `rgb(${Math.round(27 + 78 * k)},${Math.round(42 + 98 * k)},${Math.round(64 + 130 * k)})`;
          ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); ctx.fill();
        }
        // a soft light on the LAND only (source-atop): edge dots stay #1b2a40, the middle of the frame lifts a little,
        // so the world reads while the ocean stays dark
        ctx.globalCompositeOperation = "source-atop";
        const lg = ctx.createRadialGradient(960, 500, 0, 960, 500, 980);
        lg.addColorStop(0, `rgba(96,136,204,${(0.42 * dim).toFixed(3)})`); lg.addColorStop(0.6, `rgba(96,136,204,${(0.16 * dim).toFixed(3)})`); lg.addColorStop(1, "rgba(96,136,204,0)");
        ctx.fillStyle = lg; ctx.fillRect(0, 0, 1920, 1080);
        ctx.globalCompositeOperation = "source-over";
        // feeder routes (faint), then the main routes
        ctx.lineCap = "round";
        for (const r of FEED) {
          const p = S.clamp((t - r.t0) / (r.t1 - r.t0), 0, 1); if (p <= 0) continue;
          const pe = E.move(p), Q1 = { x: r.A.x + (r.C.x - r.A.x) * pe, y: r.A.y + (r.C.y - r.A.y) * pe }, Q2 = bez(r.A, r.C, r.B, pe);
          ctx.strokeStyle = `rgba(${ORANGE},${(0.3 * dim * (1 - 0.55 * fx.lane)).toFixed(3)})`; ctx.lineWidth = 1.3 * zh;
          ctx.beginPath(); ctx.moveTo(SX(r.A.x), SY(r.A.y)); ctx.quadraticCurveTo(SX(Q1.x), SY(Q1.y), SX(Q2.x), SY(Q2.y)); ctx.stroke();
        }
        for (const r of ARCS) {
          const p = S.clamp((t - r.t0) / (r.t1 - r.t0), 0, 1); if (p <= 0) continue;
          const pe = E.move(p), Q1 = { x: r.A.x + (r.C.x - r.A.x) * pe, y: r.A.y + (r.C.y - r.A.y) * pe }, Q2 = bez(r.A, r.C, r.B, pe);
          const em = r.lane ? 1 + 0.5 * fx.lane : 1, al = (r.lane ? 1 : 1 - 0.62 * fx.lane) * dim;
          const path = () => { ctx.beginPath(); ctx.moveTo(SX(r.A.x), SY(r.A.y)); ctx.quadraticCurveTo(SX(Q1.x), SY(Q1.y), SX(Q2.x), SY(Q2.y)); };
          ctx.strokeStyle = `rgba(${ORANGE},${(0.16 * al).toFixed(3)})`; ctx.lineWidth = 8 * zh * em; path(); ctx.stroke();
          ctx.strokeStyle = `rgba(${ORANGE},${(0.92 * al).toFixed(3)})`; ctx.lineWidth = 2.4 * zh * em; path(); ctx.stroke();
        }
        // ports
        for (const p of ports) {
          const age = t - p.t; if (age < 0) continue;
          const x = SX(p.x), y = SY(p.y);
          if (x < -20 || x > 1940 || y < -20 || y > 1100) continue;
          ctx.fillStyle = `rgba(${ORANGE},${(0.9 * dim).toFixed(3)})`;
          ctx.beginPath(); ctx.arc(x, y, 2.7 * zd * (age < 0.2 ? E.spring(age / 0.2) : 1), 0, Math.PI * 2); ctx.fill();
          if (age < 0.55) ring(x, y, (3 + 12 * E.settle(age / 0.55)) * zd, 0.7 * (1 - age / 0.55) * dim, 1.5);
        }
        // ships: steady travel along drawn routes (continuous motion), with short tails
        ctx.globalCompositeOperation = "lighter";
        for (const r of ARCS) {
          if (t < r.t1) continue;
          const speed = 150, T = r.len / speed, intro = S.clamp((t - r.t1) / 0.4, 0, 1);
          const al = (r.lane ? 1 : 1 - 0.62 * fx.lane) * dim * intro;
          for (let k = 0; k < r.ships; k++) {
            let s = ((t - r.t1) / T + k / r.ships) % 1; const rev = k % 2 === 1; if (rev) s = 1 - s;
            const fade = Math.min(1, s * 7, (1 - s) * 7);
            for (let j = 5; j >= 0; j--) {
              const sj = rev ? s + j * 0.011 : s - j * 0.011; if (sj < 0 || sj > 1) continue;
              const q = bez(r.A, r.C, r.B, atLen(r, sj)), x = SX(q.x), y = SY(q.y);
              if (j === 0) { glowDot(x, y, 13 * zh, al * fade); ctx.fillStyle = `rgba(255,240,228,${(al * fade).toFixed(3)})`; ctx.beginPath(); ctx.arc(x, y, 2.8 * zh, 0, Math.PI * 2); ctx.fill(); }
              else { ctx.fillStyle = `rgba(${ORANGE},${(0.4 * al * fade * (1 - j / 6)).toFixed(3)})`; ctx.beginPath(); ctx.arc(x, y, 2.2 * zh * (1 - j / 8), 0, Math.PI * 2); ctx.fill(); }
            }
          }
        }
        ctx.globalCompositeOperation = "source-over";
        // hubs: ping on arrival, then a slow pulse; leaders to their chips
        for (const h of HUBS) {
          const age = t - h.t; if (age < 0) continue;
          const x = SX(h.x), y = SY(h.y), pop = age < 0.35 ? E.spring(age / 0.35) : 1;
          glowDot(x, y, 26 * zh * pop, dim);
          if (age < 0.95) ring(x, y, (7 + 46 * E.settle(age / 0.95)) * zh, 0.9 * (1 - age / 0.95) * dim, 2.5);
          const ph = (age - 1.0 - h.i * 0.37) / 2.4, pf = ph - Math.floor(ph);
          if (ph > 0 && pf < 0.5) ring(x, y, (7 + 22 * E.settle(pf / 0.5)) * zh, 0.5 * (1 - pf / 0.5) * dim, 1.5);
          ctx.fillStyle = `rgba(${ORANGE},${dim.toFixed(3)})`; ctx.beginPath(); ctx.arc(x, y, 6 * zh * pop, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = `rgba(255,236,220,${dim.toFixed(3)})`; ctx.beginPath(); ctx.arc(x, y, 2.4 * zh * pop, 0, Math.PI * 2); ctx.fill();
          const a = h.a.v; if (a > 0.01 && h.lead) { const [ax, ay] = h.lead; const dx = ax - x, dy = ay - y, L = Math.hypot(dx, dy) || 1;
            ctx.strokeStyle = `rgba(232,240,255,${(0.45 * a).toFixed(3)})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x + (dx / L) * 9, y + (dy / L) * 9); ctx.lineTo(ax, ay); ctx.stroke(); }
        }
      });

      // ---------------------------------------------------------------- S1 · title (0.45 → held to 2.3)
      tl.fromTo("#t-scrim", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "enter" }, 0.3);
      const tsp = S.lines("#title", 0.45, { dur: 0.95, stagger: S.f(9) });
      tl.to(tsp.lines, { yPercent: -100, opacity: 0, duration: 0.32, ease: "exit", stagger: S.f(3) }, 2.3);
      tl.to("#t-scrim", { opacity: 0, duration: 0.35, ease: "exit" }, 2.3);

      // ---------------------------------------------------------------- HUD + ports counter (= ports lit so far)
      tl.fromTo("#hud-l, #hud-r", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.5, ease: "enter", stagger: S.f(4) }, 2.4);
      tl.to("#hud-l, #hud-r", { opacity: 0, y: -12, duration: 0.3, ease: "exit" }, 11.95);
      const portsEl = $("#ports"), livs = [$("#live"), $("#live2")];
      S.everyFrame((t) => {
        let n = 0; for (const h of HUBS) if (t >= h.t) n++; for (const p of ports) if (t >= p.t) n++;
        const s = String(n).padStart(3, "0"); if (portsEl.textContent !== s) portsEl.textContent = s;
        const b = 0.55 + 0.45 * (0.5 + 0.5 * Math.cos((t * Math.PI * 2) / 1.6));    // the live dots breathe
        for (const l of livs) l.style.opacity = b.toFixed(3);
      });

      // ---------------------------------------------------------------- the regional counter (glass grows in; never opacity alone)
      tl.fromTo("#panel", { opacity: 0, y: 40, scale: 0.94, transformOrigin: "0% 100%" }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "springSoft" }, 9.3);
      S.count("#cnt", 9.45, 0, 18400, { dur: 0.855 });                                // lands on the 10.305 beat (held 1.6 s)
      tl.to("#panel", { opacity: 0, y: 30, duration: 0.3, ease: "exit" }, 11.9);

      // ---------------------------------------------------------------- S3 · lockup (scale 0.94 → 1, lands at rest)
      tl.fromTo("#l-scrim", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "enter" }, 12.35);
      tl.fromTo("#lock", { scale: 0.94 }, { scale: 1, duration: 1.4, ease: "settle" }, 12.5);
      tl.fromTo("#mk-arc", { drawSVG: "0%" }, { drawSVG: "100%", duration: 0.7, ease: "settle" }, 12.5);
      tl.fromTo("#mk-dot", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.6, ease: "springPop" }, 12.82);
      S.chars("#wm", 12.52, { stagger: S.f(1.1), ease: SPRING });
      S.words("#tagl", 12.85, { stagger: S.f(3), blur: 8, y: 20 });
      tl.fromTo("#cta", { opacity: 0, y: 18, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "springSoft" }, 13.03);   // strong beat 13.055

      S.grain({ opacity: 0.05 });
      S.vignette({ strength: 0.5 });
      window.__timelines["main"] = S.done().tl; // keep it LAST (lint wants the registration in the page)
    });
  </script>
