      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          // ONE tempo grid drives every onset (kinetic-beat-slam constraint #1).
          // P = one sub-beat; the storyboard's scene seams land on multiples of 4.
          var DUR = 8;
          var P = 0.325;
          function B(n) { return P * n; }

          var tl = gsap.timeline({ paused: true });

          // pin the timeline to the frame's full length — scene 6 (6.6-8.0s) is a dead-still hold.
          tl.to({ hold: 0 }, { hold: 1, duration: DUR, ease: "none" }, 0);

          /* ---- Scene 1 (0.0-1.3s): the page is simply there; hairlines rule themselves in ---- */
          tl.fromTo("#f01kr-hairtop",
            { scaleX: 0, transformOrigin: "left center" },
            { scaleX: 1, transformOrigin: "left center", duration: 0.55, ease: "power3.out" }, 0);
          tl.fromTo("#f01kr-hairbot",
            { scaleX: 0, transformOrigin: "right center" },
            { scaleX: 1, transformOrigin: "right center", duration: 0.55, ease: "power3.out" }, 0);
          tl.fromTo(["#f01kr-chrome-l", "#f01kr-chrome-r"],
            { opacity: 0 },
            { opacity: 1, duration: 0.5, ease: "power2.out" }, B(1));
          tl.fromTo("#f01kr-eyebrow",
            { y: -18, opacity: 0, filter: "blur(6px)" },
            { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, B(1));

          /* ---- Scene 2 (1.3-2.6s): line 1 slams; the clock lands two sub-beats behind ---- */
          tl.fromTo("#f01kr-l1",
            { scale: 1.32, opacity: 0, filter: "blur(14px)", transformOrigin: "left center" },
            { scale: 1, opacity: 1, filter: "blur(0px)", transformOrigin: "left center", duration: 0.5, ease: "power4.out" }, B(4));
          tl.fromTo("#f01kr-clock",
            { y: -44, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, B(6));

          /* ---- Scene 3 (2.6-3.9s): line 2 side-snaps; the ledger page fades up behind ---- */
          tl.fromTo("#f01kr-l2",
            { x: -280, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, B(8));
          tl.fromTo("#f01kr-ledger",
            { y: 28, opacity: 0 },
            { y: 0, opacity: 0.45, duration: 0.7, ease: "power3.out" }, B(10));
          tl.fromTo("#f01kr-glitch",
            { scaleY: 0.72, opacity: 0, transformOrigin: "center top" },
            { scaleY: 1, opacity: 0.28, transformOrigin: "center top", duration: 0.7, ease: "power3.out" }, B(11));

          /* ---- Scene 4 (3.9-5.2s): line 3 rises; red marks start crowding the page ---- */
          tl.fromTo("#f01kr-l3",
            { y: 84, rotation: 3, opacity: 0, transformOrigin: "left center" },
            { y: 0, rotation: 0, opacity: 1, transformOrigin: "left center", duration: 0.55, ease: "circ.out" }, B(12));
          tl.fromTo("#f01kr-qr",
            { scale: 0.72, opacity: 0, transformOrigin: "left bottom" },
            { scale: 1, opacity: 1, transformOrigin: "left bottom", duration: 0.45, ease: "power3.out" }, B(15));

          /* ---- Scenes 4+5: every mark reads its onset off the same beat array ---- */
          gsap.utils.toArray("#root .marks .mk").forEach(function (el) {
            var beat = Number(el.getAttribute("data-beat"));
            var sub = Number(el.getAttribute("data-sub"));
            var rot = Number(el.getAttribute("data-rot"));
            tl.fromTo(el,
              { opacity: 0, scaleX: 0.18, rotation: rot, transformOrigin: "left center" },
              { opacity: 1, scaleX: 1, rotation: rot, transformOrigin: "left center", duration: 0.3, ease: "power4.out" },
              B(beat) + sub * 0.07);
          });

          /* ---- Scene 5 (5.2-6.6s): the last line lands as two chunks on the same array ---- */
          /* letterSpacing snaps to device pixels under the seek-by-frame capture engine
             (lint: gsap_non_transform_motion) — the same spread reads cleanly as a
             transform: scaleX out to in, which is sub-pixel smooth. */
          tl.fromTo("#f01kr-l4a",
            { scaleX: 1.16, x: -26, opacity: 0, filter: "blur(10px)", transformOrigin: "left center" },
            { scaleX: 1, x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, B(16));
          tl.fromTo("#f01kr-l4b",
            { x: 220, opacity: 0, filter: "blur(12px)" },
            { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, B(18));

          /* ---- Scene 6 (6.6-8.0s): nothing. The frozen page is the night not passing. ---- */

          window.__timelines["01-khatar-raat"] = tl;
        })();
      </script>
