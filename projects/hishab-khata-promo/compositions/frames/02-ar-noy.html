  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var $ = function (s) { return document.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

      var band   = $("#f02-sweep-band");
      var edgeA  = $("#f02-sweep-edge-a");
      var edgeB  = $("#f02-sweep-edge-b");
      var gMask  = $("#f02-ghost-mask");
      var gLayer = $("#f02-ghost-layer");
      var line2  = $("#f02-line2");
      var rule   = $("#f02-rule-path");

      /* ---------------------------------------------------------
         SCENE 1 (0.0–0.8s) — the clearing sweep.
         css-marker-patterns · highlight mode: a full-width marker
         strip scales out from left origin, then its trailing edge
         chases across and takes Frame 1's red with it.
         The red rides a rightward cut-the-curve (power4.in ramp +
         early linear fade) matching the incoming zoom-through.
         --------------------------------------------------------- */

      /* marker strip grows left → right */
      tl.fromTo(band, { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power3.out" }, 0.0);
      /* leading pen tip */
      tl.fromTo(edgeA, { x: -10 }, { x: 1930, duration: 0.42, ease: "power3.out" }, 0.0);

      /* the red is carried rightward and dims out well before the seam */
      tl.fromTo(gLayer, { x: 0 }, { x: 170, duration: 0.50, ease: "power4.in" }, 0.24);
      tl.fromTo(gLayer, { opacity: 0.75 }, { opacity: 0, duration: 0.34, ease: "none" }, 0.34);

      /* trailing edge chases across; everything behind it is clean paper */
      tl.fromTo(
        band,
        { clipPath: "inset(0% 0% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 100%)", duration: 0.38, ease: "power3.inOut", immediateRender: false },
        0.42
      );
      tl.fromTo(edgeB, { x: -10 }, { x: 1930, duration: 0.38, ease: "power3.inOut" }, 0.42);
      tl.fromTo(
        gMask,
        { clipPath: "inset(0% 0% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 100%)", duration: 0.36, ease: "power3.inOut" },
        0.42
      );
      tl.set(gLayer, { opacity: 0 }, 0.80);

      /* ---------------------------------------------------------
         SCENE 2 (0.8–2.2s) — deliberately EMPTY.
         Grid and hairlines only. This silence is the beat.
         Nothing is scheduled in this window on purpose.
         --------------------------------------------------------- */

      /* ---------------------------------------------------------
         SCENE 3 (2.2–3.6s) — the promise begins, per-word.
         dynamic-content-sequencing: each word's slot is derived
         from its own length at build time, never hardcoded.
         --------------------------------------------------------- */
      var S3 = 2.20;
      var BASE_SLOT = 0.10;      /* minimum slot per word */
      var SEC_PER_CHAR = 0.022;  /* longer words earn more room */
      var WORD_IN = 0.55;

      tl.fromTo($("#f02-eyebrow"), { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.50, ease: "power3.out" }, S3);
      tl.fromTo($$(".chrome"), { opacity: 0 },
        { opacity: 1, duration: 0.70, ease: "power2.out" }, S3);

      var cursor = 0;
      var SEQ = $$("#f02-line1 .f02-word").map(function (el) {
        var slot = { el: el, start: cursor };
        cursor += BASE_SLOT + el.textContent.trim().length * SEC_PER_CHAR;
        return slot;
      });
      SEQ.forEach(function (slot) {
        tl.fromTo(slot.el, { opacity: 0, y: 38 },
          { opacity: 1, y: 0, duration: WORD_IN, ease: "power3.out" }, S3 + slot.start);
      });

      /* ---------------------------------------------------------
         SCENE 4 (3.6–5.0s) — the finale line lands, the amber rule
         self-draws beneath it (svg-path-draw), the frame settles
         and holds completely still.
         --------------------------------------------------------- */
      tl.fromTo(line2, { opacity: 0, y: 46 },
        { opacity: 1, y: 0, duration: 0.58, ease: "power3.out" }, 3.62);

      var len = 340;
      if (rule && typeof rule.getTotalLength === "function") {
        var measured = rule.getTotalLength();
        if (measured > 0) { len = measured; }
      }
      if (rule) {
        rule.style.strokeDasharray = String(len);
        tl.fromTo(rule, { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.70, ease: "power2.out" }, 4.05);
      }

      /* the frame's pixel-glitch signature settles in last, as paper texture */
      tl.fromTo($("#f02-glitch"), { opacity: 0 },
        { opacity: 0.13, duration: 0.60, ease: "power1.out" }, 4.18);

      /* hold the full 5s — still, no drift */
      var pad = { v: 0 };
      tl.to(pad, { v: 1, duration: 0.20, ease: "none" }, 4.80);
    })();
