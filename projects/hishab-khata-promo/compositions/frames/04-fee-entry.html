  <script>
    (function () {
      var ID = "04-fee-entry";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      if (!root) return;
      var q = function (s) { return root.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      var tl = gsap.timeline({ paused: true });

      /* ── Bengali numeral helpers (deterministic; no Date.now, no Math.random) ── */
      var BN = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
      function toBn(str) {
        var out = "";
        for (var i = 0; i < str.length; i++) {
          var c = str.charCodeAt(i);
          out += (c >= 48 && c <= 57) ? BN[c - 48] : str[i];
        }
        return out;
      }
      function grouped(n) {
        var s = String(n), out = "", c = 0;
        for (var i = s.length - 1; i >= 0; i--) {
          out = s[i] + out;
          if (++c % 3 === 0 && i > 0) out = "," + out;
        }
        return toBn(out);
      }

      /* ── one time grid, seconds ─────────────────────────────────────────── */
      var T_HEAD = 0.06, HEAD_STAG = 0.07, HEAD_DUR = 0.60;
      var PUSH_DUR = 4.20;

      var T_CARDTITLE = 1.10, T_CARDDRAW = 1.14, CARDDRAW_DUR = 0.72;
      var T_CARDFILL = 1.30, CARDFILL_DUR = 0.44;
      var FIELDS = [1.46, 1.66, 1.86], FIELD_DUR = 0.44, FLINE_DUR = 0.40;
      var T_OUTLABEL = 1.52, T_LEDGERRULE = 1.66, LEDGERRULE_DUR = 0.50;
      var CTX_ROWS = [1.82, 2.00], CTX_DUR = 0.44, CTX_DIM = 0.42;

      var T_FOCALLINE = 2.30, FOCALLINE_DUR = 0.34;
      var T_CARET = 2.34;
      var DIGITS = "১,২০০".split("");
      var T_TYPE = 2.44, TYPE_STEP = 0.13;
      var T_TYPEDONE = T_TYPE + DIGITS.length * TYPE_STEP;   /* 3.09 */
      var T_UNDERLINE = 3.06, UNDERLINE_DUR = 0.30;

      /* the sync: the posted row leaves as the typed value arrives — same
         direction, same speed, so the two read as ONE movement */
      var T_SYNC = 3.40, SYNC_DUR = 0.52, SYNC_LINE_DUR = 0.56;

      var T_TOTALRULE = 4.62, TOTALRULE_DUR = 0.46;
      var T_TOTALLAB = 4.68, TOTALLAB_DUR = 0.42;
      var T_COUNT = 4.78, COUNT_DUR = 1.06;

      /* every rowline rests at scaleX:0 before its own tween runs — without this
         baseline the LAST authored fromTo would set the pre-tween state for all of
         them (lint: gsap_repeated_fromto_without_baseline) */
      tl.set(qa(".f04-rowline"), { scaleX: 0 }, 0);

      /* ── macro settle: one long-tail move, fully at rest by 4.2s so the
            back half of the frame carries no camera motion at all ────────── */
      tl.fromTo(q(".f04-stage"),
        { scale: 0.990 },  /* settles IN to 1: never past the hairlines */
        { scale: 1, duration: PUSH_DUR, ease: "power3.out" }, 0);

      /* ── Scene 1 (0.0–1.1) — the headline only. Bengali by WORD. ───────── */
      tl.fromTo(qa(".f04-head .f04-w"),
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: HEAD_DUR, ease: "power3.out", stagger: HEAD_STAG }, T_HEAD);

      /* ── Scene 2 (1.1–2.3) — the panel self-draws and fills with context ── */
      tl.fromTo(q(".f04-card-title"),
        { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.40, ease: "power2.out" }, T_CARDTITLE);

      var rect = q(".f04-cardframe rect");
      var per = 2 * (618 + 378);
      gsap.set(rect, { strokeDasharray: per });
      tl.fromTo(rect,
        { strokeDashoffset: per },
        { strokeDashoffset: 0, duration: CARDDRAW_DUR, ease: "power2.inOut" }, T_CARDDRAW);

      tl.fromTo(q(".f04-cardfill"),
        { opacity: 0 }, { opacity: 1, duration: CARDFILL_DUR, ease: "power2.out" }, T_CARDFILL);

      qa(".f04-field").slice(0, 3).forEach(function (f, i) {
        tl.fromTo(f.querySelector(".f04-fline"),
          { scaleX: 0 }, { scaleX: 1, duration: FLINE_DUR, ease: "power3.out" }, FIELDS[i]);
        tl.fromTo(Array.prototype.slice.call(f.querySelectorAll("span")),
          { y: 12, opacity: 0 },
          { y: 0, opacity: 1, duration: FIELD_DUR, ease: "power3.out", stagger: 0.04 }, FIELDS[i]);
      });

      tl.fromTo(q(".f04-out-label"),
        { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.40, ease: "power2.out" }, T_OUTLABEL);
      tl.fromTo(q(".f04-ledgerrule"),
        { scaleX: 0 }, { scaleX: 1, duration: LEDGERRULE_DUR, ease: "power3.out" }, T_LEDGERRULE);

      /* the two existing rows are CONTEXT — they arrive dim and stay dim */
      qa(".f04-row").slice(0, 2).forEach(function (row, i) {
        tl.fromTo(row.querySelector(".f04-rowline"),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.48, ease: "power3.out", immediateRender: false }, CTX_ROWS[i]);
        tl.fromTo(row,
          { y: 14, opacity: 0 },
          { y: 0, opacity: CTX_DIM, duration: CTX_DUR, ease: "power3.out" }, CTX_ROWS[i]);
      });

      /* ── Scene 3 (2.3–3.4) — the টাকা value types in, digit by digit ───── */
      tl.fromTo(q(".f04-focal .f04-fline"),
        { scaleX: 0 }, { scaleX: 1, duration: FOCALLINE_DUR, ease: "power3.out" }, T_FOCALLINE);
      tl.fromTo(Array.prototype.slice.call(q(".f04-focal").querySelectorAll("span:first-child")),
        { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.36, ease: "power3.out" }, T_FOCALLINE);

      var caret = q(".f04-caret");
      var typed = q(".f04-typed");
      tl.fromTo(caret, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "none" }, T_CARET);

      DIGITS.forEach(function (d, i) {
        tl.call(function () {
          typed.textContent = DIGITS.slice(0, i + 1).join("");
        }, null, T_TYPE + i * TYPE_STEP);
      });
      /* seeking backwards must un-type, so restate the empty state at the head */
      tl.call(function () { typed.textContent = ""; }, null, 0);

      tl.fromTo(q(".f04-focal .f04-fline"),
        { scaleY: 1 }, { scaleY: 3, duration: UNDERLINE_DUR, ease: "power3.out" }, T_UNDERLINE);
      tl.to(caret, { opacity: 0, duration: 0.18, ease: "none" }, T_TYPEDONE + 0.12);

      /* ── Scene 4 (3.4–4.6) — THE SIGNATURE SYNC.
            Row ০৪৩ posts itself in the same amber, entering from the left on
            the same direction and speed the typed value settled with, so the
            eye carries the cause straight into the effect. ───────────────── */
      var newRow = q(".f04-new");
      tl.fromTo(newRow.querySelector(".f04-rowline"),
        { scaleX: 0 },
        { scaleX: 1, duration: SYNC_LINE_DUR, ease: "power3.out", immediateRender: false }, T_SYNC);
      tl.fromTo(newRow,
        { x: -34, opacity: 0 },
        { x: 0, opacity: 1, duration: SYNC_DUR, ease: "power3.out" }, T_SYNC);
      /* the amber pulse that ties the two sides together */
      tl.fromTo(q(".f04-focal b"),
        { scale: 1.06 }, { scale: 1, duration: SYNC_DUR, ease: "power3.out" }, T_SYNC);

      /* ── Scene 5 (4.6–6.0) — the month total counts up, then dead still ── */
      tl.fromTo(q(".f04-totalrule"),
        { scaleX: 0 }, { scaleX: 1, duration: TOTALRULE_DUR, ease: "power3.out" }, T_TOTALRULE);
      tl.fromTo(q(".f04-total span"),
        { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: TOTALLAB_DUR, ease: "power2.out" }, T_TOTALLAB);

      var totalEl = q(".f04-total b");
      var st = { v: 0 };
      var last = -1;
      tl.fromTo(totalEl, { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power2.out" }, T_COUNT);
      tl.to(st, {
        v: 51600,
        duration: COUNT_DUR,
        ease: "power3.out",
        onUpdate: function () {
          var r = Math.round(st.v / 100) * 100;
          if (r !== last) { last = r; totalEl.textContent = "৳ " + grouped(r); }
        }
      }, T_COUNT);
      tl.fromTo(totalEl, { scale: 0.82 }, { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, T_COUNT);

      /* nothing moves after 5.84s — the frame ends completely still */

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
