  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="03-product-intro"]');
      var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      var tl = gsap.timeline({ paused: true });

      /* ---------------------------------------------------------------
         Scene 1 (0.0-1.2s) — three ledger rules slide in from the left
         edge at staggered speeds and stack centred on the wordmark's own
         centre.  center-outward-expansion run INWARD: xPercent/yPercent
         -50 bakes the centring, x tweens from an off-frame offset to 0,
         y holds each rule's stack offset.  Two depth layers: the thin
         faint pair behind, the thick full-strength rule in front.
      --------------------------------------------------------------- */
      var RULE_FROM_X = [-1460, -1560, -1400];
      var RULE_DUR    = [0.90, 0.95, 0.85];
      var RULE_AT     = [0.10, 0.20, 0.30];
      var RULE_OP     = [0.55, 1.00, 0.55];

      var rules = qa(".f03-rule");
      rules.forEach(function (el, i) {
        var ty = Number(el.dataset.ty);
        tl.fromTo(el,
          { xPercent: -50, yPercent: -50, x: RULE_FROM_X[i], y: ty, opacity: 0 },
          { x: 0, y: ty, opacity: RULE_OP[i], duration: RULE_DUR[i], ease: "power3.out" },
          RULE_AT[i]);
      });

      /* ---------------------------------------------------------------
         Scene 2 (1.2-2.6s) — THE SIGNATURE ASSEMBLE (scale-swap-transition).
         Outgoing: the three rules compress toward one another (y -> 0) while
         the group shrinks to EXIT_SCALE and fades, power2.in.
         Incoming: the wordmark scales up from that same EXIT_SCALE at the
         exact same centre, starting OVERLAP before the exit finishes, and
         sits above the outgoing on z.  Both share transform-origin 50% 50%.
         Long-tail power3 settle instead of back.out — this frame's motion
         doctrine forbids overshoot.
      --------------------------------------------------------------- */
      var TRIGGER = 1.20, EXIT_DUR = 0.42, ENTER_DUR = 0.62, OVERLAP = 0.16, EXIT_SCALE = 0.72;

      rules.forEach(function (el) {
        tl.to(el, { y: 0, duration: EXIT_DUR, ease: "power2.in" }, TRIGGER);
      });
      tl.to(".f03-asm", { scale: EXIT_SCALE, opacity: 0, duration: EXIT_DUR, ease: "power2.in" }, TRIGGER);

      tl.fromTo(".wordmark",
        { scale: EXIT_SCALE, opacity: 0 },
        { scale: 1, opacity: 1, duration: ENTER_DUR, ease: "power3.out" },
        TRIGGER + EXIT_DUR - OVERLAP);

      /* the page's resting ledger ruling re-establishes above the landed
         mark — center-outward-expansion run OUTWARD as a centre-out scaleX */
      qa(".mark-rules i").forEach(function (el, i) {
        tl.fromTo(el,
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 0.45, duration: 0.50, ease: "power3.out" },
          2.14 + i * 0.07);
      });

      /* ---------------------------------------------------------------
         Scene 3 (2.6-4.2s) — the tagline reveals word by word beneath the
         wordmark, on the same staggered settle the rules used.  Each word
         starts pulled toward the line centre and expands outward into place
         (center-outward-expansion, partially-spread start).  Split by WORD,
         never by character — a Bengali cluster must not be broken.
      --------------------------------------------------------------- */
      var PULL = 0.34, WORD_AT = 2.70, WORD_STAGGER = 0.10, WORD_DUR = 0.62;
      var tagline = root.querySelector(".tagline");
      var words = qa(".tagline .f03-w");
      var tRect = tagline.getBoundingClientRect();
      var cx = tRect.left + tRect.width / 2;

      words.forEach(function (el, i) {
        var r = el.getBoundingClientRect();
        var dx = (cx - (r.left + r.width / 2)) * PULL;
        if (!isFinite(dx) || tRect.width === 0) { dx = (3 - i) * 26; }
        tl.fromTo(el,
          { x: dx, y: 16, scale: 0.90, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: WORD_DUR, ease: "power3.out" },
          WORD_AT + i * WORD_STAGGER);
      });

      /* ---------------------------------------------------------------
         Scene 4 (4.2-6.0s) — the amber rule self-draws under the lockup
         (svg-path-draw: measured getTotalLength, dashoffset len -> 0),
         then the frame settles and holds completely still.
      --------------------------------------------------------------- */
      var amber = root.querySelector(".f03-amber-line");
      var len = amber.getTotalLength();
      if (!isFinite(len) || len <= 0) { len = 220; }
      amber.style.strokeDasharray = String(len);

      tl.fromTo(amber,
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: 0.70, ease: "power2.out" },
        4.25);

      /* hold the settled frame still through the full 6s */
      tl.to({ hold: 0 }, { hold: 1, duration: 0.001 }, 5.999);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-product-intro"] = tl;
    })();
  </script>
